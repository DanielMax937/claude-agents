[project]
name = "claude-kit"
version = "0.1.0"
description = "Python toolkit for Claude Agent SDK with message formatting and skill wrapper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.18",
    "fastapi>=0.109.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "google>=3.0.0",
    "google-api-python-client>=2.189.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.2.4",
]

[tool.setuptools]
packages = ["commodity_pipeline"]

[project.optional-dependencies]
pipeline = [
    "pytest>=7.0.0",
]

[project.scripts]
commodity-pipeline = "commodity_pipeline.pipeline:cli"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
